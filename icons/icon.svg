<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a8a"/>
      <stop offset="100%" style="stop-color:#5b8af0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d4a853"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Sun -->
  <circle cx="220" cy="200" r="70" fill="url(#sun)"/>
  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="14" stroke-linecap="round">
    <line x1="220" y1="100" x2="220" y2="80"/>
    <line x1="220" y1="300" x2="220" y2="320"/>
    <line x1="120" y1="200" x2="100" y2="200"/>
    <line x1="320" y1="200" x2="340" y2="200"/>
    <line x1="150" y1="130" x2="136" y2="116"/>
    <line x1="290" y1="270" x2="304" y2="284"/>
    <line x1="290" y1="130" x2="304" y2="116"/>
    <line x1="150" y1="270" x2="136" y2="284"/>
  </g>
  <!-- Cloud -->
  <ellipse cx="300" cy="310" rx="90" ry="60" fill="rgba(255,255,255,0.95)"/>
  <ellipse cx="240" cy="330" rx="70" ry="55" fill="rgba(255,255,255,0.95)"/>
  <ellipse cx="340" cy="340" rx="65" ry="50" fill="rgba(255,255,255,0.95)"/>
  <rect x="175" y="330" width="230" height="60" rx="0" fill="rgba(255,255,255,0.95)"/>
</svg>
